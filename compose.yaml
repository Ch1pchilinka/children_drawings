services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "8080:8080"
    volumes:
      - mlflow-data:/mlflow

  trtexec-build:
    image: nvcr.io/nvidia/tensorrt:24.07-py3
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      trtexec
      --onnx=artifacts/onnx_models/children_drawings.onnx
      --saveEngine=artifacts/tensorrt_models/children_drawings.plan
      --fp16
      --minShapes=input:1x3x300x300
      --optShapes=input:16x3x300x300
      --maxShapes=input:32x3x300x300
      --verbose

  trtexec-benchmark-b1:
    image: nvcr.io/nvidia/tensorrt:24.07-py3
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      trtexec
      --loadEngine=artifacts/tensorrt_models/children_drawings.plan
      --shapes=input:1x3x300x300
      --warmUp=500
      --duration=30
      --useSpinWait

  trtexec-benchmark-b2:
    image: nvcr.io/nvidia/tensorrt:24.07-py3
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      trtexec
      --loadEngine=artifacts/tensorrt_models/children_drawings.plan
      --shapes=input:16x3x300x300
      --warmUp=500
      --duration=30
      --useSpinWait

  trtexec-benchmark-b3:
    image: nvcr.io/nvidia/tensorrt:24.07-py3
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command: >
      trtexec
      --loadEngine=artifacts/tensorrt_models/children_drawings.plan
      --shapes=input:32x3x300x300
      --warmUp=500
      --duration=30
      --useSpinWait

  triton-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.triton-pipeline
    image: triton-seminar-pipeline:24.07
    runtime: nvidia
    shm_size: "2gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8100:8000" # HTTP
      - "8101:8001" # gRPC
      - "8102:8002" # Prometheus metrics
    volumes:
      - ./models_pipeline:/models
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=1

  web-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: children-drawings-web:latest
    depends_on:
      - triton-pipeline
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TRITON_URL: triton-pipeline:8000
      TRITON_MODEL_NAME: children_drawings
    ports:
      - "8200:8000"

volumes:
  mlflow-data:

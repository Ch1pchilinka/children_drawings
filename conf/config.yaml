# conf/config.yaml
defaults:
  - _self_

data:
  data_root: ./data
  batch_size: 64
  num_workers: 4

model:
  name: efficientnet_b3  # или "baseline"
  freeze_below_index: 300   # только для efficientnet_b3

training:
  seed: 42
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  precision: 16-mixed       # или 32, если нет поддержки mixed precision
  log_every_n_steps: 50
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  resume: null

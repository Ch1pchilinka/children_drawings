[project]
name = "children-drawings"
version = "0.1.0"
description = "Classification of children drawings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "datasets>=4.8.5",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "fastapi>=0.115.0",
    "hydra-core>=1.3.2",
    "mlflow==3.12.0",
    "numpy>=2.2.6",
    "onnx>=1.21.0",
    "onnxruntime==1.20.1",
    "onnxscript>=0.7.0",
    "pillow>=12.2.0",
    "pydantic>=2.11.7",
    "pytorch-lightning>=2.6.1",
    "python-multipart>=0.0.20",
    "requests>=2.33.1",
    "torch>=2.11.0",
    "torchmetrics>=1.8.0",
    "torchvision>=0.26.0",
    "tritonclient[http]>=2.68.0",
    "uvicorn[standard]>=0.34.0",
    "opencv-python>=4.13.0.92",
]

[project.scripts]
children-drawings-train = "children_drawings.train:main"
children-drawings-evaluate = "children_drawings.evaluate:main"
children-drawings-export = "children_drawings.exporting:main"
children-drawings-infer = "children_drawings.inference:main"
children-drawings-api = "children_drawings.api:main"

[dependency-groups]
dev = [
    "fire>=0.7.1",
    "huggingface-hub>=1.14.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["children_drawings"]

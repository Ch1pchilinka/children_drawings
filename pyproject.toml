[project]
name = "children-drawings"
version = "0.1.0"
description = "Classification of children drawings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "datasets>=4.8.5",
    "dvc-s3>=3.3.0",
    "huggingface-hub>=1.14.0",
    "hydra-core>=1.3.2",
    "mlflow>=3.12.0",
    "numpy>=2.2.6",
    "onnx>=1.21.0",
    "onnxruntime==1.20.1",
    "opencv-python>=4.13.0.92",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pytorch-lightning>=2.6.1",
    "requests>=2.33.1",
    "scikit-learn>=1.7.2",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "timm>=1.0.27",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "fire>=0.7.1",
    "pre-commit>=4.6.0",
]

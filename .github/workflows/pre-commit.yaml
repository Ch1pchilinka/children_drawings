name: pre-commit

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: children_drawings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --config children_drawings/.pre-commit-config.yaml --all-files
